name = "eawg-mobile"
compatibility_date = "2026-10-01"
main = "worker/index.js"

[assets]
directory = "./public"
binding = "ASSETS"
# Alleen /api/ gaat eerst langs de Worker; de rest komt rechtstreeks uit public/.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "eawg-accounts"
# Het echte id van de database, gemaakt met "npx wrangler d1 create eawg-accounts".
database_id = "10e6ffc0-7fad-4dba-92f8-4da02f944a5e"
